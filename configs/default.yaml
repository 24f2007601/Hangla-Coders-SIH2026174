camera:
  device: 0
  width: 1280
  height: 720
  fps: 30
  format: MJPG
  backend: auto
  disable_dynamic_framerate: false

pose:
  model: mediapipe
  pose_model_path: models/pose_landmarker_lite.task
  hand_model_path: models/hand_landmarker.task

  # Lowered from 0.5 after testing the real recordings.
  min_detection_confidence: 0.3

  min_tracking_confidence: 0.5

  min_hand_detection_confidence: 0.3
  min_hand_presence_confidence: 0.4
  min_hand_tracking_confidence: 0.4

  hand_hold_seconds: 0.5
  with_hands: true

classifier:
  model_type: xgboost
  model_path: models/step_classifier_fused.json
  confidence_threshold: 0.5

database:
  url: sqlite:///data/project.db
  output_dir: data/processed

pipeline:
  sequence_length: 30
  classify_hop: 5
  smoothing_window: 5
  max_fps: 30
  metrics_enabled: false